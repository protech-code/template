name: Auto Code Formatter Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  format:
    name: Format Code Automatically
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn bằng PAT của Tài khoản phụ
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      # 2. Cài đặt Node.js & Prettier Plugins
      - name: Set up Node.js & Install Prettier Plugins
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier and Plugins
        run: |
          npm install -g prettier @prettier/plugin-php prettier-plugin-java

      # 3. Cài đặt Clang-Format cho C/C++
      - name: Install Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      # 4. Format đa ngôn ngữ
      - name: Run Prettier
        run: |
          npx prettier --write "**/*.{js,jsx,ts,tsx,html,css,scss,php,java,json,md,yml,yaml}" || true

      # 5. Format C/C++
      - name: Run Clang-Format for C/C++
        run: |
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -not -path "./node_modules/*" -not -path "./vendor/*" | while read -r file; do
            clang-format -i -style=Google "$file"
          done

      # 6. Kiểm tra thay đổi
      - name: Check for changes
        id: verify-changed-files
        uses: tj-actions/changed-files@v44

      # 7. Commit & Push dưới danh nghĩa Tài khoản phụ
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 [Bot] Auto-format code structure (Prettier + Clang-Format)'
          commit_user_name: 'protech-bot'
          commit_user_email: 'minhduc290613@proton.me'
          commit_author: 'protech-bot <minhduc290613@proton.me>'
