name: 🤖 Auto Generate README

on:
  push:
    branches:
      - main
      - master
    # Chỉ chạy khi có sự thay đổi code, bỏ qua nếu chỉ sửa README hoặc Workflow
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn bằng tài khoản phụ (BOT_PAT)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          fetch-depth: 0

      # 2. Cài đặt Python để quét cấu trúc Repo và render README
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Tự động phân tích Repo và sinh file README.md
      - name: Generate README.md
        run: |
          python -c '
          import os, glob

          # Lấy tên Repository
          repo_name = os.environ.get("GITHUB_REPOSITORY", "My-Project").split("/")[-1]

          # Danh sách bỏ qua
          ignore_dirs = {".git", ".github", "node_modules", "vendor", "__pycache__", "dist", "build"}

          # Thu thập danh sách file và extension
          files_tree = []
          extensions = set()

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ignore_dirs]
              rel_path = os.path.relpath(root, ".")
              if rel_path == ".":
                  level = 0
              else:
                  level = rel_path.count(os.sep) + 1

              indent = "  " * level
              folder_name = os.path.basename(root)
              if level > 0:
                  files_tree.append(f"{indent}📁 {folder_name}/")

              sub_indent = "  " * (level + 1)
              for f in files[:10]:  # Giới hạn hiển thị file mỗi thư mục
                  if not f.startswith("."):
                      files_tree.append(f"{sub_indent}📄 {f}")
                      ext = os.path.splitext(f)[1].lower()
                      if ext:
                          extensions.add(ext)

          # Nhận diện công nghệ dựa trên extension
          tech_stack = []
          ext_map = {
              ".js": "JavaScript", ".ts": "TypeScript", ".jsx": "React", ".tsx": "React / TS",
              ".html": "HTML5", ".css": "CSS3", ".scss": "Sass", ".php": "PHP",
              ".py": "Python", ".java": "Java", ".c": "C", ".cpp": "C++",
              ".json": "JSON", ".yml": "YAML", ".md": "Markdown"
          }
          for ext in extensions:
              if ext in ext_map:
                  tech_stack.append(f"`{ext_map[ext]}`")

          tech_str = ", ".join(tech_stack) if tech_stack else "`Source Code`"
          tree_str = "\n".join(files_tree[:40])  # Giới hạn độ dài cây thư mục

          # Nội dung Markdown mẫu
          readme_content = f"""# 🚀 {repo_name}

            > 🤖 *File README này được tạo tự động bởi **Auto README Bot**.*

            ## 📌 Giới thiệu
            Dự án **{repo_name}** chứa toàn bộ mã nguồn được đồng bộ và cập nhật tự động.

            ## 🛠️ Công nghệ sử dụng
            Các ngôn ngữ và công nghệ xuất hiện trong dự án:
            {tech_str}

            ## 📂 Cấu trúc dự án
            ```text
            {tree_str}
            ```

            ## 🚀 Hướng dẫn bắt đầu
            1. **Clone repository:**
               ```bash
               git clone https://github.com/{os.environ.get("GITHUB_REPOSITORY", "")}.git
               cd {repo_name}
               ```
            2. **Kiểm tra mã nguồn:**
               Xem chi tiết cấu trúc các thư mục ở trên để bắt đầu chỉnh sửa.

            ---
            *Cập nhật tự động bởi GitHub Actions Bot.*
            """

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)

          print("Đã tự tạo file README.md thành công!")
          '

      # 4. Kiểm tra xem file README.md có sự thay đổi không
      - name: Check for changes
        id: verify-changed-files
        uses: tj-actions/changed-files@v44

      # 5. Commit và Push README mới bằng tài khoản phụ
      - name: Commit & Push README
        if: steps.verify-changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📝 [Bot] Auto-generate README.md structure"
          commit_user_name: 'Protech BOT'
          commit_user_email: '170188739+protech-bot@users.noreply.github.com'